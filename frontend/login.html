<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Quản lý Điểm Sinh Viên</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: var(--bg-main);
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 32px;
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
    }
    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-logo {
      height: 120px;
      width: auto;
      margin-bottom: 16px;
    }
    .login-title {
      font-size: 24px;
      color: var(--primary-color);
      margin-bottom: 8px;
    }
    .login-subtitle {
      color: var(--text-muted);
    }
    .error-message {
      color: var(--danger-color);
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
      display: none;
    }
    /* Server selection styles */
    .server-select-group {
      margin-bottom: 20px;
    }
    .server-select-group label.form-label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .server-select-group .server-icon {
      font-size: 16px;
    }
    .server-select-group select {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius-md, 8px);
      border: 1px solid var(--border-color);
      background: var(--bg-main);
      color: var(--text-main);
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .server-select-group select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(var(--primary-rgb, 59,130,246), 0.15);
    }
    .server-status {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .server-status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .server-status .dot.online {
      background: #22c55e;
      box-shadow: 0 0 6px rgba(34,197,94,0.5);
    }
    .server-status .dot.offline {
      background: #ef4444;
      box-shadow: 0 0 6px rgba(239,68,68,0.5);
    }
    .server-status .dot.loading {
      background: #f59e0b;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <img src="assets/images/logo.png" alt="Logo" class="login-logo">
      <p class="login-subtitle">Đăng nhập hệ thống quản lý điểm</p>
    </div>

    <div id="errorMsg" class="error-message"></div>

    <form id="loginForm">
      <!-- Server Selection -->
      <div class="server-select-group">
        <label class="form-label" for="serverSelect">
          <span class="server-icon">🖥️</span> Chọn Server
        </label>
        <select id="serverSelect" class="form-control">
          <option value="server1">Server 1 (đang tải...)</option>
          <option value="server2">Server 2 (đang tải...)</option>
        </select>
        <div class="server-status" id="serverStatus">
          <span class="dot loading"></span>
          <span>Đang kiểm tra kết nối...</span>
        </div>
      </div>

      <div class="form-group" style="display: flex; gap: 24px; justify-content: center; margin-bottom: 20px;">
        <label style="cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 500; color: var(--text-main);">
          <input type="radio" name="loginType" value="giangvien" checked style="accent-color: var(--primary-color);"> GIẢNG VIÊN
        </label>
        <label style="cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 500; color: var(--text-main);">
          <input type="radio" name="loginType" value="sinhvien" style="accent-color: var(--primary-color);"> SINH VIÊN
        </label>
      </div>

      <div class="form-group">
        <label class="form-label" id="lblUsername" for="username">Tên đăng nhập</label>
        <input type="text" id="username" class="form-control" required placeholder="Nhập mã giảng viên hoặc admin">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Mật khẩu</label>
        <input type="password" id="password" class="form-control" required placeholder="Nhập mật khẩu">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px;">
        Đăng nhập
      </button>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // ====================================
    // LOAD SERVER LIST FROM API
    // ====================================
    async function loadServerList() {
      const select = document.getElementById('serverSelect');
      const statusEl = document.getElementById('serverStatus');

      try {
        const response = await window.API.get('/servers');
        if (response.success && response.data) {
          select.innerHTML = '';
          response.data.forEach(server => {
            const option = document.createElement('option');
            option.value = server.id;
            const statusIcon = server.connected ? '🟢' : '🔴';
            option.textContent = `${statusIcon} ${server.name} (${server.database})`;
            option.disabled = !server.connected;
            select.appendChild(option);
          });

          // Hiển thị trạng thái
          const allConnected = response.data.every(s => s.connected);
          const someConnected = response.data.some(s => s.connected);
          
          if (allConnected) {
            statusEl.innerHTML = '<span class="dot online"></span><span>Tất cả server đang hoạt động</span>';
          } else if (someConnected) {
            statusEl.innerHTML = '<span class="dot online"></span><span>Một số server đang hoạt động</span>';
          } else {
            statusEl.innerHTML = '<span class="dot offline"></span><span>Không có server nào khả dụng</span>';
          }
        }
      } catch (err) {
        console.error('Không thể tải danh sách server:', err);
        statusEl.innerHTML = '<span class="dot offline"></span><span>Không thể kết nối đến backend</span>';
      }
    }

    // Load server list khi trang được tải
    loadServerList();

    // ====================================
    // Toggle label & placeholder based on radio selection
    // ====================================
    const radioGVs = document.querySelectorAll('input[name="loginType"]');
    const lblUsername = document.getElementById('lblUsername');
    const inputUsername = document.getElementById('username');

    radioGVs.forEach(radio => {
      radio.addEventListener('change', (e) => {
        if (e.target.value === 'sinhvien') {
          lblUsername.textContent = 'Mã SV';
          inputUsername.placeholder = 'Nhập mã số sinh viên (ví dụ: N20DCCN001)';
        } else {
          lblUsername.textContent = 'Tên đăng nhập';
          inputUsername.placeholder = 'Nhập mã giảng viên hoặc admin';
        }
      });
    });

    // ====================================
    // LOGIN FORM SUBMIT
    // ====================================
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const serverId = document.getElementById('serverSelect').value;
      const errorMsg = document.getElementById('errorMsg');

      try {
        errorMsg.style.display = 'none';
        await Auth.login(user, pass, serverId);
        window.location.href = 'index.html';
      } catch (error) {
        errorMsg.textContent = error.message || 'Đăng nhập thất bại. Vui lòng thử lại.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
