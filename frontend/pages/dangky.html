<div class="page-header">
  <div>
    <h1 class="page-title">Đăng ký Tín chỉ</h1>
    <div class="breadcrumb">
      <span class="breadcrumb-item">Trang chủ</span>
      <span>/</span>
      <span class="breadcrumb-item active">Đăng ký</span>
    </div>
  </div>
</div>

<!-- Thông tin Sinh viên (chỉ hiển thị khi role = SINHVIEN) -->
<div class="card" id="cardSVInfo" style="display:none; margin-bottom: 16px;">
  <div class="card-body" style="display: flex; align-items: center; gap: 20px; padding: 16px 24px;">
    <div style="font-size: 36px;">🎓</div>
    <div>
      <div style="font-weight: 700; font-size: 16px;" id="dkSVName">Đang tải...</div>
      <div style="color: var(--text-muted); font-size: 13px;">Mã SV: <strong id="dkSVMa">--</strong></div>
    </div>
    <div id="dkBadgeRole" style="margin-left: auto; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; background: rgba(59,130,246,0.12); color: var(--primary-color); border: 1px solid rgba(59,130,246,0.25);">SINH VIÊN</div>
  </div>
</div>

<!-- Bộ lọc -->
<div class="card" style="margin-bottom: 24px;">
  <div class="card-body">
    <div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end;">
      <div class="form-group" style="flex:1; min-width: 160px; margin-bottom: 0;">
        <label class="form-label">Niên khóa</label>
        <input type="text" id="dkNienKhoa" class="form-control" placeholder="VD: 2023-2024" value="2023-2024">
      </div>
      <div class="form-group" style="flex:1; min-width: 120px; margin-bottom: 0;">
        <label class="form-label">Học kỳ</label>
        <select id="dkHocKy" class="form-control">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>
      <div style="display:flex; align-items:flex-end; margin-bottom:0;">
        <button class="btn btn-primary" id="btnTimLopMo">🔍 Tìm lớp mở</button>
      </div>
    </div>
  </div>
</div>

<!-- Danh sách lớp tín chỉ có thể đăng ký -->
<div class="card">
  <div class="card-header">
    <h3 class="card-title">Danh sách lớp tín chỉ có thể đăng ký</h3>
    <span id="dkStatusMsg" style="font-size:13px; color:var(--text-muted);"></span>
  </div>
  <div class="table-responsive">
    <table class="table">
      <thead>
        <tr>
          <th width="50">Chọn</th>
          <th>Mã LTC</th>
          <th>Môn học</th>
          <th>Nhóm</th>
          <th>Giảng viên</th>
          <th style="text-align:center;">SV đã ĐK</th>
          <th style="text-align:center;">SV tối thiểu</th>
          <th style="text-align:center;">Đã đăng ký?</th>
          <th style="text-align:center;">Thao tác</th>
        </tr>
      </thead>
      <tbody id="tbodyDangKy">
        <tr><td colspan="9" style="text-align:center; color:var(--text-muted);">Nhập niên khóa, học kỳ rồi nhấn "Tìm lớp mở"</td></tr>
      </tbody>
    </table>
  </div>
  <!-- Nút đăng ký hàng loạt (chỉ hiện với SV) -->
  <div id="dkActionBar" style="display:none; padding: 16px 24px; border-top: 1px solid var(--border-color); display: flex; gap: 12px; justify-content: flex-end;">
    <button class="btn btn-primary" id="btnDangKy">✅ Đăng ký các lớp đã chọn</button>
  </div>
</div>

<script src="js/modules/dangky.js"></script>
