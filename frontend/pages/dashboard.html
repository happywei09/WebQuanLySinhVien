<div class="page-header">
  <div>
    <h1 class="page-title">Tổng quan hệ thống</h1>
    <div class="breadcrumb">
      <span class="breadcrumb-item">Trang chủ</span>
      <span>/</span>
      <span class="breadcrumb-item active">Tổng quan</span>
    </div>
  </div>
</div>


<!-- Stats Grid -->
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; margin-bottom: 24px;">
  <!-- Stats Cards -->
  <div class="card card-metric-primary">
    <div class="card-body">
      <div style="color: var(--text-muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Tổng số sinh viên</div>
      <div id="statTotalStudents" class="metric-value" style="font-size: 28px; font-weight: 700; margin-top: 8px;">...</div>
      <div style="color: var(--text-muted); font-size: 12px; margin-top: 4px;">Toàn trường</div>
    </div>
  </div>

  <div class="card card-metric-success">
    <div class="card-body">
      <div style="color: var(--text-muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Lớp tín chỉ đang mở</div>
      <div id="statOpenClasses" class="metric-value" style="font-size: 28px; font-weight: 700; margin-top: 8px;">...</div>
      <div style="color: var(--text-muted); font-size: 12px; margin-top: 4px;">Đang giảng dạy</div>
    </div>
  </div>

  <div class="card card-metric-warning">
    <div class="card-body">
      <div style="color: var(--text-muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Lớp hành chính</div>
      <div id="statTotalClasses" class="metric-value" style="font-size: 28px; font-weight: 700; margin-top: 8px;">...</div>
      <div style="color: var(--text-muted); font-size: 12px; margin-top: 4px;">Quản lý trực thuộc</div>
    </div>
  </div>

  <div class="card card-metric-danger">
    <div class="card-body">
      <div style="color: var(--text-muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Lượt đăng ký học</div>
      <div id="statTotalRegistrations" class="metric-value" style="font-size: 28px; font-weight: 700; margin-top: 8px;">...</div>
      <div style="color: var(--text-muted); font-size: 12px; margin-top: 4px;">Đăng ký tín chỉ</div>
    </div>
  </div>
</div>
