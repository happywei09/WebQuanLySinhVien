<div class="page-header">
  <div>
    <h1 class="page-title">Quản lý Giảng viên</h1>
    <div class="breadcrumb">
      <span class="breadcrumb-item">Trang chủ</span>
      <span>/</span>
      <span class="breadcrumb-item active">Giảng viên</span>
    </div>
  </div>
  <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end;">
    <button class="btn btn-khaki" id="btnUndoGV">Phục hồi</button>
    <button class="btn btn-revert" id="btnCommitGV">Ghi</button>
    <button class="btn btn-success" id="btnAddGV">+ Thêm giảng viên</button>
  </div>
</div>

<!-- Bộ lọc và tìm kiếm giảng viên -->
<div class="card" style="margin-bottom: 24px;">
  <div class="card-body" style="display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end;">
    <div style="flex: 2; min-width: 250px;">
      <label class="form-label"
        style="font-weight: 600; font-size: 12px; color: var(--text-muted); margin-bottom: 6px;">TÌM KIẾM GIẢNG
        VIÊN</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="searchGV" class="form-control" placeholder="Nhập mã GV hoặc họ tên cần tìm..."
          style="flex: 1;" />
        <button class="btn btn-secondary" id="btnSearchGV" style="flex-shrink: 0; height: 38px;">Tìm</button>
      </div>
    </div>
  </div>
</div>

<div class="card giangvien-list-card">
  <div class="card-header" style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
    <h3 class="card-title" style="margin:0;">Danh sách giảng viên</h3>
    <span id="giangvienPendingStatus" style="font-size:13px; color:var(--text-muted);"></span>
  </div>
  <div class="table-responsive giangvien-list-scroll">
    <table class="table" style="text-align: center;">
      <thead>
        <tr>
          <th>STT</th>
          <th>Mã GV</th>
          <th>Họ Tên</th>
          <th>Học vị</th>
          <th>Học hàm</th>
          <th>Chuyên môn</th>
          <th>Mã Khoa</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="8" style="text-align:center;">Dữ liệu từ SP_GET_ALL_GIANGVIEN</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<style>
  /* Giang vien list - scrollable box */
  .giangvien-list-card .giangvien-list-scroll {
    max-height: 420px;
    overflow-y: auto;
  }

  .giangvien-list-card .giangvien-list-scroll table thead th {
    position: sticky;
    top: 0;
    background: var(--bg-surface);
    z-index: 2;
    border-bottom: 2px solid var(--border-color);
  }

  .giangvien-list-card .giangvien-list-scroll::-webkit-scrollbar {
    width: 6px;
  }

  .giangvien-list-card .giangvien-list-scroll::-webkit-scrollbar-track {
    background: var(--bg-main);
  }

  .giangvien-list-card .giangvien-list-scroll::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 3px;
  }
</style>

<script src="js/modules/giangvien.js"></script>
