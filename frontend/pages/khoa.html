<div class="page-header">
  <div>
    <h1 class="page-title">Quản lý Khoa</h1>
    <div class="breadcrumb">
      <span class="breadcrumb-item">Trang chủ</span>
      <span>/</span>
      <span class="breadcrumb-item active">Khoa</span>
    </div>
  </div>
  <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end;">
    <button class="btn btn-secondary" id="btnUndoKhoa">
      Phục hồi
    </button>
    <button class="btn btn-success" id="btnCommitKhoa">
      Ghi
    </button>
    <button class="btn btn-primary" id="btnAddKhoa">
      + Thêm khoa mới
    </button>
  </div>
</div>

<div class="card">
  <div class="card-header">
    <div style="display: flex; gap: 12px; align-items: center; width: 100%; max-width: 520px; flex-wrap: wrap;">
      <input type="text" id="searchKhoa" class="form-control" placeholder="Tìm kiếm khoa...">
      <button class="btn btn-secondary" id="btnSearchKhoa">Tìm</button>
      <span id="khoaPendingStatus" style="font-size: 13px; color: var(--text-muted);"></span>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table" id="tableKhoa">
      <thead>
        <tr>
          <th width="80">STT</th>
          <th width="150">Mã Khoa</th>
          <th>Tên Khoa</th>
          <th width="150" style="text-align: center;">Thao tác</th>
        </tr>
      </thead>
      <tbody id="tbodyKhoa">
        <!-- JS render here -->
      </tbody>
    </table>
  </div>
</div>
<!-- Modal sửa -->
<div class="modal-overlay" id="modalKhoa">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Sửa Khoa</h3>
      <button class="btn-close" id="btnCloseModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="formKhoa">
        <div class="form-group">
          <label class="form-label required" for="maKhoa">Mã Khoa</label>
          <input type="text" id="maKhoa" class="form-control" required placeholder="Ví dụ: CNTT">
        </div>
        <div class="form-group">
          <label class="form-label required" for="tenKhoa">Tên Khoa</label>
          <input type="text" id="tenKhoa" class="form-control" required placeholder="Ví dụ: Công nghệ thông tin">
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="btnCancelModal">Huỷ</button>
      <button class="btn btn-primary" id="btnSaveKhoa">Lưu sửa</button>
    </div>
  </div>
</div>

<script src="js/modules/khoa.js"></script>
