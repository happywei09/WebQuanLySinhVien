<div class="page-header">

    </div>
  </div>

</div>

<div class="card" style="margin-bottom: 24px;">
  <div class="card-body">
    <div class="form-row"
      style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: end;">
      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" for="filterNienKhoa">Niên khóa</label>
        <select id="filterNienKhoa" class="form-control">
          <option value="">Tất cả Niên khóa</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" for="filterHocKy">Học kỳ</label>

          <option value="2">2</option>

      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" for="filterMonHoc">Tên môn học</label>
        <select id="filterMonHoc" class="form-control">
          <option value="">Tất cả Tên môn học</option>

      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" for="filterTrangThai">Trạng thái</label>
        <select id="filterTrangThai" class="form-control">
          <option value="">Tất cả Trạng thái</option>
          <option value="0">Đang mở</option>
          <option value="1">Đã hủy</option>
        </select>

          <th>Số SV Tối Thiểu</th>
          <th>Hủy lớp</th>
          <th>Thao tác</th>

      </thead>
      <tbody>
        <tr>
          <td colspan="9" style="text-align:center;">Dữ liệu từ SP_GET_DS_LOP_TIN_CHI</td>
        </tr>
