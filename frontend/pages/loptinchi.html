<div class="page-header">
  <div>
    <h1 class="page-title">Quản lý Lớp Tín Chỉ</h1>
    <div class="breadcrumb">
      <span class="breadcrumb-item">Trang chủ</span>
      <span>/</span>
      <span class="breadcrumb-item active">Lớp tín chỉ</span>
    </div>
  </div>
  <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end;">
    <button class="btn btn-khaki" id="btnUndoLTC">Phục hồi</button>
    <button class="btn btn-revert" id="btnCommitLTC">Ghi</button>
    <button class="btn btn-success" id="btnAddLTC">+ Mở lớp tín chỉ</button>
  </div>
</div>

<div class="card" style="margin-bottom: 24px;">
  <div class="card-body">
    <div class="form-row"
      style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: end;">
      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" for="filterNienKhoa">Niên khóa</label>
        <select id="filterNienKhoa" class="form-control">
          <option value="">Tất cả Niên khóa</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" for="filterHocKy">Học kỳ</label>
        <select id="filterHocKy" class="form-control">
          <option value="">Tất cả Học kỳ</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" for="filterMonHoc">Tên môn học</label>
        <select id="filterMonHoc" class="form-control">
          <option value="">Tất cả Tên môn học</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" for="filterTrangThai">Trạng thái</label>
        <select id="filterTrangThai" class="form-control">
          <option value="">Tất cả Trạng thái</option>
          <option value="0">Đang mở</option>
          <option value="1">Đã hủy</option>
        </select>
      </div>
    </div>
  </div>
</div>

<div class="card loptinchi-list-card">
  <div class="card-header" style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
    <h3 class="card-title" style="margin:0;">Danh sách lớp tín chỉ</h3>
    <span id="loptinchiPendingStatus" style="font-size:13px; color:var(--text-muted);"></span>
  </div>
  <div class="table-responsive loptinchi-list-scroll">
    <table class="table" style="text-align: center;">
      <thead>
        <tr>
          <th>Mã LTC</th>
          <th>Niên khóa</th>
          <th>Học kỳ</th>
          <th>Tên môn học</th>
          <th>Nhóm</th>
          <th>Giảng viên</th>
          <th>Khoa</th>
          <th>Số SV Tối Thiểu</th>
          <th>Hủy lớp</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="10" style="text-align:center;">Dữ liệu từ SP_GET_DS_LOP_TIN_CHI</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<style>
  /* Lop tin chi list - scrollable box */
  .loptinchi-list-card .loptinchi-list-scroll {
    max-height: 420px;
    overflow-y: auto;
  }

  .loptinchi-list-card .loptinchi-list-scroll table thead th {
    position: sticky;
    top: 0;
    background: var(--bg-surface);
    z-index: 2;
    border-bottom: 2px solid var(--border-color);
  }

  .loptinchi-list-card .loptinchi-list-scroll::-webkit-scrollbar {
    width: 6px;
  }

  .loptinchi-list-card .loptinchi-list-scroll::-webkit-scrollbar-track {
    background: var(--bg-main);
  }

  .loptinchi-list-card .loptinchi-list-scroll::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 3px;
  }
</style>

<script src="js/modules/loptinchi.js"></script>
