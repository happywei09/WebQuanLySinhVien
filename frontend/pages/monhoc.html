<div class="page-header">
  <div>
    <h1 class="page-title">Quản lý Môn học</h1>
    <div class="breadcrumb">
      <span class="breadcrumb-item">Trang chủ</span>
      <span>/</span>
      <span class="breadcrumb-item active">Môn học</span>
    </div>
  </div>
  <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end;">
    <button class="btn btn-khaki" id="btnUndoMH">Phục hồi</button>
    <button class="btn btn-revert" id="btnCommitMH">Ghi</button>
    <button class="btn btn-success" id="btnAddMH">+ Thêm môn học</button>
  </div>
</div>

<!-- Bộ lọc và tìm kiếm môn học -->
<div class="card" style="margin-bottom: 24px;">
  <div class="card-body" style="display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end;">
    <div style="flex: 2; min-width: 250px;">
      <label class="form-label"
        style="font-weight: 600; font-size: 12px; color: var(--text-muted); margin-bottom: 6px;">TÌM KIẾM MÔN HỌC</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="searchMH" class="form-control" placeholder="Nhập mã hoặc tên môn học cần tìm..." style="flex: 1;" />
        <button class="btn btn-secondary" id="btnSearchMH" style="flex-shrink: 0; height: 38px;">Tìm</button>
      </div>
    </div>
  </div>
</div>

<div class="card monhoc-list-card">
  <div class="card-header" style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
    <h3 class="card-title" style="margin:0;">Danh sách môn học</h3>
    <span id="monhocPendingStatus" style="font-size:13px; color:var(--text-muted);"></span>
  </div>
  <div class="table-responsive monhoc-list-scroll">
    <table class="table" style="text-align: center;">
      <thead>
        <tr>
          <th>STT</th>
          <th>Mã MH</th>
          <th>Tên Môn Học</th>
          <th>Số Tiết LT</th>
          <th>Số Tiết TH</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="6" style="text-align:center;">Dữ liệu từ SP_GET_ALL_MONHOC</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<style>
  /* Mon hoc list - scrollable box */
  .monhoc-list-card .monhoc-list-scroll {
    max-height: 420px;
    overflow-y: auto;
  }

  .monhoc-list-card .monhoc-list-scroll table thead th {
    position: sticky;
    top: 0;
    background: var(--bg-surface);
    z-index: 2;
    border-bottom: 2px solid var(--border-color);
  }

  .monhoc-list-card .monhoc-list-scroll::-webkit-scrollbar {
    width: 6px;
  }

  .monhoc-list-card .monhoc-list-scroll::-webkit-scrollbar-track {
    background: var(--bg-main);
  }

  .monhoc-list-card .monhoc-list-scroll::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 3px;
  }
</style>

<script src="js/modules/monhoc.js"></script>
