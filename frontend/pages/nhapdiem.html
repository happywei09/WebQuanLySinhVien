<div class="page-header">
  <div>
    <h1 class="page-title">Nhập Điểm Lớp Tín Chỉ</h1>
    <div class="breadcrumb">
      <span class="breadcrumb-item">Trang chủ</span>
      <span>/</span>
      <span class="breadcrumb-item active">Nhập Điểm</span>
    </div>
  </div>
  <div style="display: flex; gap: 12px; flex-wrap: wrap;">
    <button class="btn btn-secondary" id="btnResetFilter">
      ↺ Đặt lại
    </button>
    <button class="btn btn-success" id="btnSaveAllDiem" disabled>
      Lưu tất cả thay đổi
    </button>
  </div>
</div>

<div class="card" style="margin-bottom: 24px;">
  <div class="card-body">
    <div class="form-row"
      style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: end;">
      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" for="inputNienKhoa">Niên khóa</label>
        <select id="inputNienKhoa" class="form-control">
          <option value="">Tất cả Niên khóa</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" for="selectHocKy">Học kỳ</label>
        <select id="selectHocKy" class="form-control">
          <option value="">Tất cả Học kỳ</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" for="selectMonHoc">Môn học</label>
        <select id="selectMonHoc" class="form-control">
          <option value="">Tất cả Môn học</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" for="selectNhom">Nhóm</label>
        <select id="selectNhom" class="form-control">
          <option value="">Tất cả Nhóm</option>
        </select>
      </div>
    </div>


  </div>
</div>

<!-- DANH SÁCH LỚP TÍN CHỈ -->
<div class="card" id="danhSachLopCard" style="display: none; margin-bottom: 24px;">
  <div class="card-header">
    <h3 class="card-title">Danh sách Lớp Tín Chỉ</h3>
  </div>
  <div class="table-responsive">
    <table class="table" id="tableLopTinChi">
      <thead>
        <tr>
          <th width="50" style="text-align: center;">STT</th>
          <th width="100" style="text-align: center;">Mã LTC</th>
          <th>Môn học</th>
          <th width="80" style="text-align: center;">Nhóm</th>
          <th>Giảng viên</th>
          <th width="120" style="text-align: center;">SV tối thiểu</th>
          <th width="120" style="text-align: center;">Trạng thái</th>
          <th width="120" style="text-align: center;">Hành động</th>
        </tr>
      </thead>
      <tbody id="tbodyLopTinChi">
        <!-- Will be populated dynamically -->
      </tbody>
    </table>
  </div>
</div>

<!-- BẢNG ĐIỂM CHI TIẾT -->
<div class="card" id="bangDiemCard" style="display: none;">
  <div class="card-header"
    style="display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: center;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <button class="btn btn-secondary" id="btnBackToLopList" style="padding: 6px 12px; font-size: 13px;">
        ⬅ Quay lại
      </button>
      <div>
        <h3 class="card-title">Bảng điểm sinh viên</h3>
        <div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;" id="selectionSummary"></div>
      </div>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <button class="btn btn-secondary btn-sm" id="btnRefreshGradeSheet" style="padding: 6px 12px; font-size: 13px;">
        ↻ Làm mới
      </button>
      <span style="font-size: 13px; color: var(--text-muted);" id="unsavedWarning"></span>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table" id="tableDiem">
      <thead>
        <tr>
          <th width="50">STT</th>
          <th width="150">Mã SV</th>
          <th>Họ và tên</th>
          <th width="100" style="text-align: center;">Điểm CC (10%)</th>
          <th width="100" style="text-align: center;">Điểm GK (30%)</th>
          <th width="100" style="text-align: center;">Điểm CK (60%)</th>
          <th width="120" style="text-align: center; font-weight: bold; color: var(--primary-color);">Điểm TK</th>
        </tr>
      </thead>
      <tbody id="tbodyDiem">
        <tr>
          <td colspan="7" style="text-align:center; color: var(--text-muted);">Chọn thông tin và bấm Bắt đầu để tải danh
            sách sinh viên</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script src="js/modules/nhapdiem.js"></script>
