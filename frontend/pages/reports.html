<div class="page-header no-print">
  <div>
    <h1 class="page-title">Báo cáo Thống kê</h1>
    <div class="breadcrumb">
      <span class="breadcrumb-item">Trang chủ</span>
      <span>/</span>
      <span class="breadcrumb-item active">Báo cáo</span>
    </div>
  </div>
</div>

<!-- CHOOSE REPORT TYPE & FILTERS -->
<div class="card no-print" style="margin-bottom: 24px;">
  <div class="card-body">
    <div
      style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; align-items: flex-end;">

      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" for="reportTypeSelect">Chọn loại báo cáo</label>
        <select id="reportTypeSelect" class="form-control">
          <option value="">-- Chọn loại báo cáo --</option>
          <option value="ds_ltc">1. Danh sách lớp tín chỉ đã mở</option>
          <option value="dssv_ltc">2. Danh sách sinh viên đăng ký lớp tín chỉ</option>
          <option value="bang_diem_mh">3. Bảng điểm môn học lớp tín chỉ</option>
          <option value="phieu_diem">4. Phiếu điểm cá nhân sinh viên</option>
          <option value="bang_diem_tk">5. Bảng điểm tổng kết theo lớp (Cross-Tab)</option>
        </select>
      </div>

      <!-- NIEN KHOA & HOC KY (Used by ds_ltc, dssv_ltc, bang_diem_mh) -->
      <div class="form-group filter-group" id="groupNienKhoaHocKy" style="display: none; margin-bottom: 0;">
        <label class="form-label" for="reportNienKhoa">Niên khóa</label>
        <select id="reportNienKhoa" class="form-control"></select>
      </div>

      <div class="form-group filter-group" id="groupHocKy" style="display: none; margin-bottom: 0;">
        <label class="form-label" for="reportHocKy">Học kỳ</label>
        <select id="reportHocKy" class="form-control">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>

      <!-- LOP TIN CHI SELECT (Used by dssv_ltc, bang_diem_mh) -->
      <div class="form-group filter-group" id="groupLopTinChi"
        style="display: none; margin-bottom: 0; min-width: 250px;">
        <label class="form-label" for="reportLTC">Lớp tín chỉ</label>
        <select id="reportLTC" class="form-control">
          <option value="">-- Tải lớp tín chỉ --</option>
        </select>
      </div>

      <!-- SINH VIEN INPUT (Used by phieu_diem) -->
      <div class="form-group filter-group" id="groupSinhVien" style="display: none; margin-bottom: 0;">
        <label class="form-label" for="reportMaSV">Mã Sinh Viên</label>
        <input type="text" id="reportMaSV" class="form-control" placeholder="Nhập mã SV (ví dụ: N20DCCN001)">
      </div>

      <!-- LOP SELECT (Used by bang_diem_tk) -->
      <div class="form-group filter-group" id="groupLop" style="display: none; margin-bottom: 0;">
        <label class="form-label" for="reportMaLop">Lớp học</label>
        <select id="reportMaLop" class="form-control">
          <option value="">-- Chọn lớp --</option>
        </select>
      </div>

      <div style="display: none;">
        <button class="btn btn-primary" id="btnGenerateReport" style="width: 100%;">Tạo báo cáo</button>
      </div>
    </div>
  </div>
</div>

<!-- ACTION BUTTONS -->
<div class="card no-print" id="reportActionsCard" style="display: none; margin-bottom: 24px;">
  <div class="card-body" style="display: flex; gap: 12px; justify-content: flex-end;">
    <button class="btn btn-secondary" id="btnPrintReport">🖨 In báo cáo (PDF)</button>
    <button class="btn btn-secondary" id="btnExportExcel">📥 Xuất file Excel</button>
  </div>
</div>

<!-- REPORT DISPLAY CONTAINER -->
<div class="card" id="reportDisplayCard" style="display: none;">
  <div class="card-body" id="printReportArea">
    <!-- Print-only official header (Hidden on screen, visible on print) -->
    <div class="print-only print-header-academic">
      <table style="width: 100%; border: none; margin-bottom: 10px; border-collapse: collapse;">
        <tr style="border: none;">
          <td
            style="width: 45%; text-align: center; vertical-align: top; border: none; padding: 0; line-height: 1.4; color: #000; font-family: var(--font-family);">
            <span style="font-size: 12px; text-transform: uppercase;">HỌC VIỆN CÔNG NGHỆ</span><br>
            <span style="font-size: 12px; text-transform: uppercase; font-weight: bold;">BƯU CHÍNH VIỄN THÔNG CƠ SỞ TP HỒ
              CHÍ MINH</span>
          </td>
          <td
            style="width: 55%; text-align: center; vertical-align: top; border: none; padding: 0; line-height: 1.4; color: #000; font-family: var(--font-family);">
            <span style="font-size: 12px; font-weight: bold; text-transform: uppercase;">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT
              NAM</span><br>
            <span style="font-size: 12px; font-weight: bold;">Độc lập - Tự do - Hạnh phúc</span>
          </td>
        </tr>
      </table>

      <!-- Ngày tháng lập biểu (căn phải) -->
      <div style="text-align: right; font-style: italic; margin-bottom: 25px; margin-right: 5%; font-size: 13px; color: #000; font-family: var(--font-family);">
        <span id="printHeaderDate">TP. Hồ Chí Minh, ngày 10 tháng 06 năm 2026</span>
      </div>
    </div>

    <!-- Dynamic Report Content gets injected here -->
    <div id="reportHeader" style="text-align: center; margin-bottom: 24px;">
      <!-- Title & subtitle gets injected here -->
    </div>
    <div class="table-responsive">
      <table class="table" id="reportTable" style="width: 100%; border-collapse: collapse;">
        <thead id="reportTableHead"></thead>
        <tbody id="reportTableBody"></tbody>
      </table>
    </div>
    <div id="reportFooter" style="margin-top: 20px; font-weight: 600; text-align: left;">
      <!-- Footer summaries get injected here -->
    </div>

    <!-- Print-only signature footer -->
    <div class="print-only print-footer" style="margin-top: 40px; width: 100%;">
      <div
        style="display: flex; justify-content: space-between; text-align: center; font-size: 14px; font-family: var(--font-family); color: #000;">
        <div style="width: 220px;">
          <p style="font-weight: bold; margin-bottom: 80px; color: #000;">NGƯỜI LẬP BIỂU</p>
          <p style="font-style: italic; color: #475569; font-size: 13px;">(Ký, ghi rõ họ tên)</p>
        </div>
        <div style="width: 300px;">
          <!-- <p id="reportPrintDate" style="font-style: italic; margin-bottom: 8px; color: #334155;">Hà Nội, ngày ..... tháng ..... năm 20...</p> -->
          <p style="font-weight: bold; margin-bottom: 80px; color: #000;">XÁC NHẬN CỦA KHOA/TRƯỜNG</p>
          <p style="font-style: italic; color: #475569; font-size: 13px;">(Ký tên và đóng dấu)</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Print specific CSS to ensure clean exports -->
<style>
  /* Ẩn phần tử in trên màn hình */
  .print-only {
    display: none !important;
  }

  @media print {

    /* Cho phép hiển thị tiêu đề in */
    .print-only {
      display: block !important;
    }

    /* Reset cấu trúc trang để in nhiều trang không bị cắt */
    html,
    body,
    .app-container,
    .main-content,
    .page-content {
      height: auto !important;
      overflow: visible !important;
      display: block !important;
      background: white !important;
      color: black !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    /* Ẩn các thành phần giao diện không liên quan */
    .sidebar,
    .topbar,
    .no-print,
    .toast-container,
    .modal-overlay {
      display: none !important;
    }

    /* Reset Card */
    .card {
      border: none !important;
      box-shadow: none !important;
      background: transparent !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    /* Cấu hình vùng in */
    #printReportArea {
      width: 100% !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    /* Căn chỉnh lại tiêu đề báo cáo khi in */
    #reportHeader {
      margin-bottom: 20px !important;
    }

    #reportHeader h2 {
      color: #000 !important;
      font-size: 18px !important;
      font-weight: bold !important;
      margin-top: 10px !important;
      text-transform: uppercase !important;
    }

    #reportHeader p {
      color: #000 !important;
      font-size: 12px !important;
      line-height: 1.5 !important;
    }

    /* Định dạng bảng in chính thức */
    #reportTable {
      width: 100% !important;
      border-collapse: collapse !important;
      margin-top: 15px !important;
    }

    #reportTable th,
    #reportTable td {
      border: 1px solid #000 !important;
      padding: 8px 10px !important;
      color: #000 !important;
      background: transparent !important;
      font-size: 12px !important;
    }

    #reportTable th {
      background-color: #f1f5f9 !important;
      font-weight: bold !important;
      text-align: center !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    #reportFooter {
      color: #000 !important;
      font-size: 12px !important;
      margin-top: 15px !important;
    }

    /* Hiển thị chân trang ký nhận */
    .print-footer {
      display: block !important;
      margin-top: 40px !important;
      page-break-inside: avoid !important;
    }

    .print-footer,
    .print-footer p,
    .print-footer div {
      color: #000 !important;
    }

    /* Thiết lập khổ giấy và lề in */
    @page {
      size: A4 portrait;
      margin: 15mm;
    }
  }
</style>

<script src="js/modules/reports.js"></script>
