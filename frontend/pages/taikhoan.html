<div class="page-header no-print">
  <div>
    <h1 class="page-title">Quản lý Tài khoản</h1>
    <div class="breadcrumb">
      <span class="breadcrumb-item">Trang chủ</span>
      <span>/</span>
      <span class="breadcrumb-item active">Quản lý Tài khoản</span>
    </div>
  </div>
</div>

<div class="account-grid" style="display: grid; grid-template-columns: 1fr 1.2fr; gap: 24px; align-items: start;">
  
  <!-- CREATE ACCOUNT FORM -->
  <div class="card">
    <div class="card-header">
      <h3 class="card-title" style="color: var(--primary-color); text-transform: uppercase; font-size: 15px; font-weight: 700; letter-spacing: 0.5px;">Tạo Tài Khoản Đăng Nhập Chương Trình</h3>
    </div>
    <div class="card-body">
      <form id="createAccountForm" onsubmit="return false;">
        
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label required" for="accNhanVien">Họ tên nhân viên</label>
            <select id="accNhanVien" class="form-control" required>
              <option value="">-- Chọn nhân viên --</option>
            </select>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="accMaNV">MãNV</label>
            <input type="text" id="accMaNV" class="form-control" readonly placeholder="Mã NV">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label required" for="accUsername">Tài khoản</label>
          <input type="text" id="accUsername" class="form-control" required placeholder="Nhập tên tài khoản login" autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label required" for="accPassword">Mật mã</label>
          <input type="password" id="accPassword" class="form-control" required placeholder="Nhập mật khẩu (tối thiểu 3 ký tự)" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label required" for="accRole">Nhóm quyền</label>
          <select id="accRole" class="form-control" required>
            <option value="">-- Chọn nhóm quyền --</option>
            <option value="PGV">PGV (Phòng Giáo Vụ)</option>
            <option value="KHOA">KHOA (Cấp Khoa)</option>
            <option value="SINHVIEN">SV (Sinh Viên)</option>
          </select>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 30px; justify-content: space-between; flex-wrap: wrap;">
          <button type="button" class="btn btn-primary" id="btnCreateAccount" style="flex: 1.2; min-width: 140px; padding: 12px; font-weight: 600;">
            <span>➕ Tạo tài khoản</span>
          </button>
          
          <button type="button" class="btn btn-danger" id="btnDeleteAccount" style="flex: 1.2; min-width: 140px; padding: 12px; font-weight: 600;">
            <span>🗑️ Xóa tài khoản</span>
          </button>

          <button type="button" class="btn btn-secondary" id="btnExit" style="flex: 0.8; min-width: 80px; padding: 12px;">
            <span>Thoát</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- LOGIN LIST -->
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">Danh Sách Tài Khoản Đăng Nhập</h3>
      <button class="btn btn-secondary" id="btnRefreshAccounts" style="padding: 6px 12px; font-size: 12px; font-weight: 600;">🔄 Làm mới</button>
    </div>
    <div class="card-body" style="padding: 0; overflow-x: auto;">
      <table class="table" style="width: 100%; border-collapse: collapse; margin-bottom: 0;">
        <thead>
          <tr>
            <th style="width: 60px; text-align: center;">STT</th>
            <th>Họ và tên</th>
            <th>Tài khoản</th>
            <th style="width: 100px; text-align: center;">Nhóm quyền</th>
            <th style="width: 120px; text-align: center;">Trạng thái</th>
            <th style="width: 90px; text-align: center;">Hành động</th>
          </tr>
        </thead>
        <tbody id="accountsTableBody">
          <tr>
            <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">
              Đang tải danh sách tài khoản...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- CSS responsive helper for this page -->
<style>
  @media (max-width: 1024px) {
    .account-grid {
      grid-template-columns: 1fr !important;
    }
  }
</style>

<script src="js/modules/taikhoan.js"></script>
